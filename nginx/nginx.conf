# =============================================================================
# Nginx — API Gateway & Reverse Proxy
#
# Single HTTP entry-point (port 80) for the entire LMS platform.
# Proxies each URL prefix to the responsible upstream service:
#
#   /                     — Next.js frontend        (frontend:3000)
#   /api/courses          — Course service           (course-service:8001)
#   /api/users            — User service             (user-service:8002)
#   /api/auth             — User service (auth)      (user-service:8002)
#   /api/ai               — AI tutor service         (ai-tutor-service:8004)
#   /api/analytics        — Analytics service        (analytics-service:8003)
#   /n8n/                 — n8n workflow automation  (n8n-automation:5678)
#   /health               — Gateway liveness probe   (inline 200 JSON)
#
# WebSocket upgrades are forwarded to the frontend to support Next.js
# hot-module replacement in development (Connection: upgrade header).
#
# All proxy locations forward X-Real-IP and X-Forwarded-For so upstream
# services can log accurate client addresses.
# =============================================================================

events {
    worker_connections 1024;
}

http {
    # Use Docker embedded DNS for runtime service discovery so proxy targets
    # keep working after backend container restarts and IP changes.
    resolver 127.0.0.11 ipv6=off valid=10s;

    server {
        listen 80;
        server_name localhost;

        # Frontend
        location / {
            set $frontend_upstream http://learning-frontend:3000;
            proxy_pass $frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Course Service API
        location /api/courses {
            set $course_upstream http://course-service:8001;
            proxy_pass $course_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # User Service API
        location /api/users {
            set $user_upstream http://user-service:8002;
            proxy_pass $user_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/auth {
            set $user_upstream http://user-service:8002;
            proxy_pass $user_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # AI Tutor Service API (longer timeouts for LLM inference)
        location /api/ai {
            set $ai_upstream http://ai-tutor-service:8004;
            proxy_pass $ai_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # Analytics Service API
        location /api/analytics {
            set $analytics_upstream http://analytics-service:8003;
            proxy_pass $analytics_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # n8n Automation
        location /n8n/ {
            set $n8n_upstream http://n8n-automation:5678;
            proxy_pass $n8n_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check
        location /health {
            return 200 '{"status": "ok"}';
            add_header Content-Type application/json;
        }
    }
}

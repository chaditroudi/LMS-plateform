# =============================================================================
# Docker Compose \u2014 LMS Platform
#
# Orchestrates all platform services on a shared internal network (lms-network).
# Start everything with:   docker compose up --build
# Stop and remove:         docker compose down -v
#
# Services:
#   nginx            \u2014 API gateway / reverse proxy (port 80)
#   frontend         \u2014 Next.js learning portal      (port 3000)
#   course-service   \u2014 FastAPI course management    (port 8001)
#   user-service     \u2014 Node.js auth & profiles      (port 8002)
#   analytics-service\u2014 FastAPI analytics            (port 8003)
#   ai-tutor-service \u2014 FastAPI AI tutor             (port 8004)
#   postgres         \u2014 PostgreSQL 16 database        (port 5432)
#   mongo            \u2014 MongoDB 7 database            (port 27017)
#   redis            \u2014 Redis cache                   (port 6379)
#
# Health checks on postgres, mongo, and redis ensure dependent services
# only start once the databases are ready to accept connections.
#
# IMPORTANT: Change JWT_SECRET and all database credentials before deploying
# to any environment beyond local development.
# =============================================================================

services:
  # API Gateway
  nginx-gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - learning-frontend
      - course-service
      - user-service
      - ai-tutor-service
      - analytics-service
    networks:
      - lms-network
    restart: unless-stopped

  # Learning Portal - Next.js + shadcn/ui
  learning-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://nginx-gateway
      - NEXT_PUBLIC_COURSE_SERVICE_URL=http://course-service:8001
      - NEXT_PUBLIC_USER_SERVICE_URL=http://user-service:8002
      - NEXT_PUBLIC_AI_TUTOR_URL=http://ai-tutor-service:8004
    depends_on:
      - course-service
      - user-service
    networks:
      - lms-network
    restart: unless-stopped

  # Course Service - FastAPI
  course-service:
    build:
      context: ./services/course-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://lms_user:lms_password@postgres:5432/lms_courses
      - REDIS_URL=redis://redis:6379/0
      - N8N_WEBHOOK_BASE_URL=http://n8n-automation:5678
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lms-network
    restart: unless-stopped

  # User Service - Node.js/Express
  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/lms_users
      - JWT_SECRET=your-secret-key-change-in-production
      - REDIS_URL=redis://redis:6379/1
      - PORT=8002
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lms-network
    restart: unless-stopped

  # AI Tutor Service - FastAPI + LLM
  ai-tutor-service:
    build:
      context: ./services/ai-tutor-service
      dockerfile: Dockerfile
    ports:
      - "8004:8004"
    environment:
      - DATABASE_URL=postgresql://lms_user:lms_password@postgres:5432/lms_courses
      - REDIS_URL=redis://redis:6379/2
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_BASE_URL=${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      - LLM_MODEL=${LLM_MODEL:-llama-3.3-70b-versatile}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lms-network
    restart: unless-stopped

  # Analytics Service - FastAPI
  analytics-service:
    build:
      context: ./services/analytics-service
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=postgresql://lms_user:lms_password@postgres:5432/lms_courses
      - REDIS_URL=redis://redis:6379/3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lms-network
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=lms_user
      - POSTGRES_PASSWORD=lms_password
      - POSTGRES_DB=lms_courses
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms_user -d lms_courses"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lms-network
    restart: unless-stopped

  # MongoDB Database
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./db/init/mongo-init.js:/docker-entrypoint-initdb.d/init.js
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lms-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lms-network
    restart: unless-stopped

  # n8n Automation - Feedback Workflow
  n8n-automation:
    build:
      context: ./n8n
      dockerfile: Dockerfile
    ports:
      - "5680:5678"
    environment:
      - N8N_SECURE_COOKIE=false
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=lms_courses
      - DB_POSTGRESDB_USER=lms_user
      - DB_POSTGRESDB_PASSWORD=lms_password
      - WEBHOOK_URL=http://localhost:5680
    volumes:
      - n8n_automation_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lms-network
    restart: unless-stopped

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lms-network
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  n8n_automation_data:
  minio_data:

networks:
  lms-network:
    driver: bridge
